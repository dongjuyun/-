<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빈티지 원형 뽀모도로 타이머</title>
  <style>
    :root {
      /* 빈티지 컬러 팔레트 */
      --color-red: #d9534f;
      --color-black: #4a4a4a;
      --color-green: #6b8e23;
      --color-sky: #708090;
      
      --theme-color: var(--color-red);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f1ea;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 설정 버튼 (오른쪽 위) */
    .settings-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #555;
      transition: transform 0.3s;
    }

    .settings-btn:hover {
      transform: rotate(45deg);
    }

    /* 중앙 원형 타이머 Container */
    .timer-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .svg-ring {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .ring-bg {
      fill: none;
      stroke: #e0ddd5;
      stroke-width: 12;
    }

    .ring-progress {
      fill: none;
      stroke: var(--theme-color);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 879.64; /* 2 * PI * r (r=140) */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }

    /* 타이머 중앙 텍스트 UI */
    .timer-center-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .mode-label {
      font-size: 1rem;
      font-weight: 600;
      color: #777;
      margin-bottom: 5px;
    }

    .time-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #333;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .controls button {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background-color: #333;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .controls button:hover {
      opacity: 0.8;
    }

    /* 설정 모달 창 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #faf8f5;
      padding: 25px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal h3 {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 15px;
      text-align: center;
    }

    .setting-section {
      margin-bottom: 20px;
    }

    .setting-section label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
    }

    /* 색상 선택 버튼그룹 */
    .color-options {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .color-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .color-btn:hover {
      transform: scale(1.1);
    }

    .color-btn.selected {
      border-color: #333;
    }

    .btn-red { background-color: var(--color-red); }
    .btn-black { background-color: var(--color-black); }
    .btn-green { background-color: var(--color-green); }
    .btn-sky { background-color: var(--color-sky); }

    /* 프리셋 선택 드롭다운 */
    .preset-select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      background: #fff;
    }

    /* 직접 입력 폼 */
    .custom-time-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .custom-time-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.9rem;
      text-align: center;
    }

    .custom-apply-btn {
      padding: 8px 12px;
      background-color: #555;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .custom-apply-btn:hover {
      background-color: #333;
    }

    /* 소리 설정 토글 버튼 */
    .sound-toggle-group {
      display: flex;
      gap: 10px;
    }

    .sound-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #555;
      transition: all 0.2s;
    }

    .sound-btn.active {
      background-color: #333;
      color: #fff;
      border-color: #333;
    }

    .close-btn {
      width: 100%;
      padding: 10px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 설정 버튼 -->
  <button class="settings-btn" id="openSettings">⚙️</button>

  <!-- 원형 타이머 영역 -->
  <div class="timer-container">
    <svg class="svg-ring">
      <circle class="ring-bg" cx="160" cy="160" r="140"></circle>
      <circle class="ring-progress" id="progressRing" cx="160" cy="160" r="140"></circle>
    </svg>
    <div class="timer-center-content">
      <div class="mode-label" id="modeLabel">공부 시간</div>
      <div class="time-display" id="timeDisplay">25:00</div>
      <div class="controls">
        <button id="startBtn">시작</button>
        <button id="resetBtn">리셋</button>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>타이머 설정</h3>
      
      <!-- 색상 고르기 -->
      <div class="setting-section">
        <label>테마 색상 (빈티지)</label>
        <div class="color-options">
          <button class="color-btn btn-red selected" data-color="var(--color-red)"></button>
          <button class="color-btn btn-black" data-color="var(--color-black)"></button>
          <button class="color-btn btn-green" data-color="var(--color-green)"></button>
          <button class="color-btn btn-sky" data-color="var(--color-sky)"></button>
        </div>
      </div>

      <!-- 프리셋 선택 -->
      <div class="setting-section">
        <label>기본 시간 선택</label>
        <select class="preset-select" id="presetSelect">
          <option value="25-5">25분 공부 / 5분 휴식</option>
          <option value="45-5">45분 공부 / 5분 휴식</option>
          <option value="60-10">1시간 공부 / 10분 휴식</option>
        </select>
      </div>

      <!-- 직접 시간 입력 -->
      <div class="setting-section">
        <label>직접 시간 입력 (분)</label>
        <div class="custom-time-group">
          <input type="number" id="customWork" placeholder="공부" min="1" max="180" value="25">
          <span>/</span>
          <input type="number" id="customBreak" placeholder="휴식" min="1" max="60" value="5">
          <button class="custom-apply-btn" id="applyCustomBtn">적용</button>
        </div>
      </div>

      <!-- 알림음 설정 -->
      <div class="setting-section">
        <label>알림음 설정</label>
        <div class="sound-toggle-group">
          <button class="sound-btn active" id="soundOnBtn">🔔 소리 켜기</button>
          <button class="sound-btn" id="soundOffBtn">🔕 음소거</button>
        </div>
      </div>

      <button class="close-btn" id="closeSettings">완료</button>
    </div>
  </div>

  <script>
    const RADIUS = 140;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

    let workSec = 25 * 60;
    let breakSec = 5 * 60;

    let totalSec = workSec;
    let leftSec = workSec;
    let timerId = null;
    let isWorking = true;
    let endTime = null;
    let isSoundOn = true; // 소리 활성화 상태

    const progressRing = document.getElementById('progressRing');
    const timeDisplay = document.getElementById('timeDisplay');
    const modeLabel = document.getElementById('modeLabel');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    const modalOverlay = document.getElementById('modalOverlay');
    const openSettings = document.getElementById('openSettings');
    const closeSettings = document.getElementById('closeSettings');
    const presetSelect = document.getElementById('presetSelect');
    const colorBtns = document.querySelectorAll('.color-btn');

    const customWork = document.getElementById('customWork');
    const customBreak = document.getElementById('customBreak');
    const applyCustomBtn = document.getElementById('applyCustomBtn');

    const soundOnBtn = document.getElementById('soundOnBtn');
    const soundOffBtn = document.getElementById('soundOffBtn');

    // 가볍고 단조로운 알림음 생성 (Web Audio API)
    function playBeepSound() {
      if (!isSoundOn) return;

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine'; // 순수한 부드러운 음
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 노트를 나타내는 주파수

        // 부드럽게 감쇄하는 볼륨 조절
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {
        console.log('오디오 재생 실패:', e);
      }
    }

    function setProgress(percent) {
      const offset = CIRCUMFERENCE - (percent * CIRCUMFERENCE);
      progressRing.style.strokeDashoffset = offset;
    }

    function updateDisplay() {
      const m = Math.floor(leftSec / 60);
      const s = leftSec % 60;
      timeDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      
      const percent = leftSec / totalSec;
      setProgress(percent);
    }

    function tick() {
      const now = Date.now();
      leftSec = Math.round((endTime - now) / 1000);

      if (leftSec <= 0) {
        leftSec = 0;
        updateDisplay();
        
        clearInterval(timerId);
        timerId = null;
        startBtn.textContent = '시작';
        
        // 시간이 다 되었을 때 알림음 발생
        playBeepSound();

        isWorking = !isWorking;
        if (isWorking) {
          totalSec = workSec;
          leftSec = workSec;
          modeLabel.textContent = '공부 시간';
          alert('휴식이 끝났습니다! 다시 집중해볼까요?');
        } else {
          totalSec = breakSec;
          leftSec = breakSec;
          modeLabel.textContent = '☕ 휴식 시간';
          alert('고생하셨습니다! 잠시 휴식을 취하세요.');
        }
        updateDisplay();
        return;
      }

      updateDisplay();
    }

    function startTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
        startBtn.textContent = '시작';
        return;
      }

      startBtn.textContent = '일시정지';
      endTime = Date.now() + (leftSec * 1000);
      timerId = setInterval(tick, 500);
    }

    function resetTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
        startBtn.textContent = '시작';
      }
      isWorking = true;
      modeLabel.textContent = '공부 시간';
      totalSec = workSec;
      leftSec = workSec;
      updateDisplay();
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && timerId !== null) {
        tick();
      }
    });

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);

    openSettings.addEventListener('click', () => modalOverlay.classList.add('active'));
    closeSettings.addEventListener('click', () => modalOverlay.classList.remove('active'));

    colorBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        colorBtns.forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        const color = e.target.getAttribute('data-color');
        document.documentElement.style.setProperty('--theme-color', color);
      });
    });

    presetSelect.addEventListener('change', (e) => {
      const [w, b] = e.target.value.split('-').map(Number);
      workSec = w * 60;
      breakSec = b * 60;
      
      customWork.value = w;
      customBreak.value = b;
      
      resetTimer();
    });

    applyCustomBtn.addEventListener('click', () => {
      const w = parseInt(customWork.value);
      const b = parseInt(customBreak.value);

      if (isNaN(w) || isNaN(b) || w <= 0 || b <= 0) {
        alert('올바른 시간을 입력해주세요. (1분 이상)');
        return;
      }

      workSec = w * 60;
      breakSec = b * 60;
      resetTimer();
      alert(`공부 ${w}분 / 휴식 ${b}분으로 설정되었습니다.`);
    });

    // 알림음 토글 설정
    soundOnBtn.addEventListener('click', () => {
      isSoundOn = true;
      soundOnBtn.classList.add('active');
      soundOffBtn.classList.remove('active');
    });

    soundOffBtn.addEventListener('click', () => {
      isSoundOn = false;
      soundOffBtn.classList.add('active');
      soundOnBtn.classList.remove('active');
    });

    updateDisplay();
  </script>
</body>
</html>
